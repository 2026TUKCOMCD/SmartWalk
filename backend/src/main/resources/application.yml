spring:
  application:
    name: navblind-server

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:navblind}
    username: ${DB_USERNAME:navblind}
    password: ${DB_PASSWORD:navblind_dev}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      # 개발 단계: update (스키마 자동 업데이트)
      # 운영 단계: validate (스키마 검증만)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /v1

# OSRM Configuration
osrm:
  base-url: ${OSRM_BASE_URL:http://localhost:5000}
  timeout: 10000

# Nominatim Configuration (역지오코딩 fallback용으로 유지)
nominatim:
  base-url: ${NOMINATIM_BASE_URL:http://localhost:8088}
  timeout: 5000

# Kakao Local API (장소 검색 + 역지오코딩)
kakao:
  api-key: ${KAKAO_API_KEY:}
  timeout: 5000

# Firebase Configuration
# credentials-path: 키 파일 경로 (backend/ 기준 상대경로 또는 절대경로)
# disabled=true → X-User-Id 헤더로 인증 대체 (개발/테스트 전용)
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:smartwalker-firebase-adminsdk-key.json}
  disabled: ${FIREBASE_DISABLED:false}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    "[com.navblind]": DEBUG
    "[org.springframework.web]": INFO
    "[org.hibernate.SQL]": DEBUG
