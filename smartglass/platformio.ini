[platformio]
default_envs = esp32cam

; ─── ESP32-CAM (AI Thinker 모듈) ───────────────────────────────────────────
[env:esp32cam]
platform   = espressif32
board      = esp32cam
framework  = arduino

; 시리얼 모니터 / 업로드 속도
monitor_speed = 115200
upload_speed  = 921600

; PSRAM 활성화 및 파티션 (카메라 + MJPEG 버퍼를 위해 huge_app 사용)
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; 의존 라이브러리
lib_deps =
    ; ESP32 공식 카메라 드라이버는 Arduino-ESP32 프레임워크에 내장됨
    ; (esp_camera.h 직접 사용)

; 업로드 포트 (장치마다 다를 수 있음 - local.ini 에서 재정의)
; upload_port = COM3

; ─── 개발 편의용 로컬 오버라이드 ───────────────────────────────────────────
; local.ini 파일을 .gitignore 에 추가하고 각 개발자가 로컬에서만 관리
; 예: [env:esp32cam] / upload_port = COM5
